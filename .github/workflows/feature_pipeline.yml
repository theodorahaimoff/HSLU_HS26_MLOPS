name: Feature pipeline

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC (06:17 / 07:17 in Zurich), after the weekly WEA update
  workflow_dispatch: {} # "Run workflow" button under Actions

concurrency:
  group: feature-pipeline # never two runs writing the same version at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --frozen --no-dev

      - name: Run tests
        run: uv run pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_KEY_JSON }}

      - name: Run feature pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: uv run python -m src.feature_pipeline.run
