name: Feature pipeline

# Pulls SAKE, WEA and LIK, stores every pull with its download date, rebuilds the features (backfill + refresh)
# and writes a new version to the feature store on GCS.
#
# Daily: WEA is published weekly and LIK monthly, but not always on the same weekday. Unchanged files are not stored
# again (pull log, D5), so a run without new data only costs a few seconds. GitHub may start scheduled runs late.

on:
  schedule:
    - cron: "17 5 * * *" # daily 05:17 UTC (06:17 / 07:17 in Zurich)
  workflow_dispatch: {} # "Run workflow" button under Actions

concurrency:
  group: feature-pipeline # never two runs writing the same version at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install from uv.lock
        run: uv sync --locked

      - name: Unit tests # a broken pipeline must not write a feature version
        run: uv run pytest -q

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_KEY_JSON }}

      - name: Run feature pipeline
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: uv run python -m src.feature_pipeline.run
